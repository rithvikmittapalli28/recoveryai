name: RecoverAI Reconciliation Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Reconciliation
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${{ vars.RECOVERYAI_BASE_URL }}/api/cron/reconciliation" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to trigger reconciliation. HTTP Status: $HTTP_STATUS"
            exit 1
          else
            echo "Successfully triggered reconciliation. HTTP Status: $HTTP_STATUS"
          fi
